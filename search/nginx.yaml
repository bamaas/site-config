# Operator overrides for nginx
ingress:
  ingressClassName: nginx  # @required "Kubernetes IngressClass name (e.g. nginx, traefik)" env:ZARF_VAR_INGRESS_CLASS
  hostname: nginx.poc.local  # @required "Ingress hostname for nginx (e.g. nginx.site.local)" env:ZARF_VAR_NGINX_INGRESS_HOST
serverBlock: server { listen 8080; location /healthz { return 200; } }  # @required "Custom server block for nginx (e.g. health endpoint config)" env:ZARF_VAR_NGINX_SERVER_BLOCK
