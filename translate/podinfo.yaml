# Operator overrides for podinfo
ingress:
  className: nginx  # @required "Kubernetes IngressClass name (e.g. nginx, traefik)" env:ZARF_VAR_INGRESS_CLASS
  hosts:
    - host: podinfo.dev.local  # @required "Ingress hostname for podinfo (e.g. podinfo.site.local)" env:ZARF_VAR_PODINFO_INGRESS_HOST
      paths:
        - path: /
          pathType: ImplementationSpecific
